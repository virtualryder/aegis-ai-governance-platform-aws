  multitenant_live: "2026-09-02 HYBRID two-tenant e2e PASS (111122223333/us-east-1, env mt): one shared AgentCore control plane (gateway ben-mt-ben-gw-20vmzpygzi ENFORCE + REQUEST interceptor ben-mt-tenant-interceptor, passRequestHeaders) + 2 physically separate per-tenant data stacks. cw-a/cw-b (tenant_pha-a/b groups) allowed and routed ONLY to their own store (pha-a 1/pha-b 0/base 0 then 1/1/0); un-tenanted cw-none: 0 tools listed (require_tenant Cedar) + call 403 verbatim 'identity carries no tenant'. Evidence: benefits_eligibility_agent/evidence/AGENTCORE-MULTITENANT-E2E-2026-09-02.md; design docs/MULTI-TENANT-SAAS-DESIGN.md. Torn down."
  multitenant_audit_live: "2026-09-02 per-tenant AUDIT routing PASS (env mt2, 12/12 checks): governed-core 1.6.0 (tenancy promoted into the core; pinned by hash) routes the canonical evidence writer, the exactly-once finalize marker and the pending-approvals register to the acting tenant's own ledger / WORM vault / approvals table across BOTH hops - gateway write_audit as cw-a/cw-b landed only in pha-a/pha-b (base ledger + base vault 0 writes all run); workflow execution carrying the HMAC-signed tenant pair reached HumanSignoff writing INTENT evidence + pending approval to pha-a only; the same execution without the pair FAILED at the first state (fail-closed). Found+fixed live: missing signing-secret IAM read on the verifier Lambdas; failure-poisoning secret cache. Evidence: benefits_eligibility_agent/evidence/AGENTCORE-MULTITENANT-AUDIT-2026-09-02.md. Torn down."
  observability_live: "2026-09-02 FULL TRANSPARENCY PASS (env mt3, 2 tenants, 13/13 checks each) through the REAL AgentCore Runtime (Strands on Bedrock, ADOT): one correlation set (tenant, session_id, trace_id, request_id, case_id) joins the runtime's invoke_agent/model/tool spans (the model's reasoning), every gateway request row, each tool Lambda's structured aegis.call line, every Bedrock model-invocation row (exact bodies, requestMetadata-tagged per tenant/session) and the hash-chained WORM record (correlation block hashed). masked_before_model true for all invocations; other tenant's ledger empty. governed-core 1.7.1 (telemetry.py). Evidence: benefits_eligibility_agent/evidence/AGENTCORE-OBSERVABILITY-2026-09-02.md (+ per-tenant timelines, JSON); design docs/OBSERVABILITY-CORRELATION.md. Torn down; account model-logging config restored."
  gate_111: "2026-09-02 CONSOLIDATED GATE PASS on benefits release v0.3.0-pilot-rc1 (env mt4, ONE from-zero deployment): isolation + per-tenant audit routing 12/12, full transparency through the real AgentCore Runtime 13/13 per tenant, strict PII canary clean, end-to-end regression sweep 0 unexpected errors (20 log groups, all executions, alarms, DLQs, Lambda error metrics). Evidence: benefits_eligibility_agent/evidence/AGENTCORE-111-GATE-2026-09-02.md. Torn down; account model-logging config restored."
  kill_switch_live: "2026-09-03 KILL SWITCH on the AgentCore path PASS (env mt5, 2 tenants, real Runtime, 29/29 checks, time-to-effect 13.9 s): governed-core 1.8.0 (hash-pinned) reads the deployment's SSM kill-switch FIRST in the gateway REQUEST interceptor (tools/list + tools/call -> 403 + DENIED WORM record in the acting tenant's ledger), in every tool Lambda (KillSwitchEngaged before the handler; a Step Functions execution fails at its first state) and in the Runtime (new invocation refused; a RUNNING session stopped at its next model call); fail-closed on an unreadable flag, 15 s TTL. Engage/disengage = two AWS_IAM Lambda function URLs with one managed policy each (IAM SoD) + in-code same-identity refusal (DENIED record); the actor is the IAM-verified caller ARN; every state change is a COMMITTED row in the base ledger's hash-chained KILL-SWITCH case with WORM copies; 0-unexpected-errors sweep after. Evidence: benefits_eligibility_agent/evidence/AGENTCORE-KILL-SWITCH-2026-09-03.md. Torn down."
  budget_live: "2026-09-03 PER-TENANT TOKEN + USD BUDGET on the AgentCore path PASS (env mt6, 2 tenants, real Runtime, 24/24 checks): governed-core 1.9.0 budget.py meters EVERY model call - one conditional DynamoDB reservation (ADD used/reserved with used <= cap, cannot oversell) BEFORE the call in the Runtime (botocore before-call hook), the drafter Lambda and the gateway interceptor (tools/call refused 403 + DENIED WORM record in the acting tenant's ledger when at/over cap); the real Converse usage is committed AFTER with a USD estimate from a pinned price table (price_version recorded on every commit; Anthropic models are absent from the AWS Price List API, so the table is pinned and labelled). Proven: meter == the account's Bedrock model-invocation log to the token (tokens_in 7004 / out 305 / 2 calls / usd_micro 25587 on the run-1 window); capped tenant refused at gateway, drafter (Step Functions DraftNotice -> ManualReview, fail-closed) and runtime, plus a RUNNING session stopped mid-session at its next model call; per-tenant cap overrides by PutItem; 60/85 % CloudWatch alarms (Aegis/Budget TokensUsedPct + UsdUsedPct) reached ALARM; AWS Budgets monthly USD ceiling (Service = Amazon Bedrock, ACTUAL + FORECASTED notifications, APPLY_IAM_POLICY action that denies bedrock:Invoke*/Converse* on the drafter + Runtime roles at 100 % ACTUAL) with a breach Lambda that engages the kill switch - exercised with a synthetic breach notification (Budgets evaluates spend up to 3x/day; ExecuteBudgetAction is refused while the action is STANDBY, seen live) and released by the deployer identity; 0-unexpected-errors sweep after. Finding closed on the sweep: the drafter's workflow-hop refusal needs the append-only ledger grant (Put + Get + TransactWrite, no Update/Delete) to land its DENIED record. Evidence: benefits_eligibility_agent/evidence/AGENTCORE-BUDGET-2026-09-03.md; design docs/TOKEN-BUDGETS-AND-COST-CEILINGS.md. Torn down; account model-logging config restored."
  pack_repin_gap1: "2026-09-03 GAP-1: the pharmacovigilance pack re-pinned from governed-core 1.5.0 to 1.9.0 (all four SaaS/observability/containment/budget controls) and RE-GATED LIVE on a from-zero two-tenant AgentCore deployment (env pv-mt, 111122223333/us-east-1, real Runtime pv_runtime_agent), then torn down to zero residue with the account model-logging config restored: isolation + per-tenant audit routing 12/12, full transparency 13/13 per tenant, strict PII canary 0 hits, kill switch 29/29 (10s to effect), per-tenant token+USD budget 24/24, end-to-end regression sweep 0 unexpected. The sweep caught a real PV tool bug the workflow-only proofs had missed (assess_seriousness crashed on the agent path because the manifest types `flags` as a JSON string; fixed + regression-tested + re-gated). Tag pharmacovigilance v0.3.0-pilot-rc1; benefits also re-affirmed on v0.4.0-pilot-rc1. EDU (1.5.0) and Housing (1.4.0) remain behind pending their own re-pin. Evidence: pharmacovigilance_agent/evidence/AGENTCORE-{111-GATE,KILL-SWITCH,BUDGET}-2026-09-03.*. See docs/DEPENDENCY-MODEL.md."
  pack_repin_gap1_edu: "2026-09-04 GAP-1 (cont.): the EDU financial-aid pack re-pinned from governed-core 1.5.0 to 1.9.0 and RE-GATED LIVE on a from-zero two-tenant AgentCore deployment (env fa-mt, 111122223333/us-east-1, 8 stacks, real Runtime financial_aid_runtime_agent), then torn down to zero residue with the account model-logging config restored: isolation + per-tenant audit routing 12/12, full transparency 13/13 per tenant (model invocations tenant-tagged, masked-before-model), strict PII canary 0 hits, kill switch 29/29 (in-flight mid-session stop, 4.2s to effect), per-tenant token+USD budget 24/24 (drafter draft_award_notice fail-closed to ManualReview with a DENIED row), end-to-end regression sweep 0 unexpected. The gate surfaced a cluster of latent port defects the offline suite could not: the runtime was launched against the stale single-tenant fa-financial deployment (wrong gateway/SSM/budget env), the runtime exec role never received its SSM/budget grant (the launcher skipped it fail-closed), lib/runtime/agent.py was still the pre-1.9.0 generic agent (no session-tenant binding, per-call budget, runtime kill-switch, or requestMetadata tenant tagging -> ported the full benefits runtime keeping EDU token_boundary P0-3), the workflow hard-coded selected_for_verification=True so no case could reach HumanSignoff (made a caller input via a SelectedProvided choice defaulting True), and the AgentCore MCP client teardown masked the governed mid-session kill with a 500 (invoke() now captures the outcome). Offline suite 174->190 (runtime kill-switch + MCP-teardown regression tests). Tag edu_financial_aid v0.3.0-pilot-rc1. Housing (1.4.0) remains behind. Evidence: edu_financial_aid_agent/evidence/AGENTCORE-{111-GATE,KILL-SWITCH,BUDGET}-2026-09-04.*. See docs/DEPENDENCY-MODEL.md."
  correctness_batch_1_10_0_live: "2026-09-05 governed-core 1.10.0 correctness batch + capture-every-API-call + token chargeback. Three fixes: audit fail-closed (#159 - finalize writes the COMMITTED WORM/hash-chained evidence BEFORE the exactly-once FINAL# marker, so an evidence-store failure marks nothing finalized and a retry re-commits cleanly, closing the audit-failure-before-side-effect fail-open); approval binding (#162 - approvals bound to case/requester/agent/action/purpose/args_sha256; finalize recomputes and refuses a consumed approval reused for a different action); deepened PII/PHI (#164 - shared pii_detect: UTF-8 byte-window chunking past Comprehend sync size limit so a large record tail is never returned unmasked, plus a Luhn-checked regex backstop for SSN/EMAIL/PHONE/IP/CARD). #168 capture-every-API-call: an account CloudTrail (management ALL + S3/Lambda data events, multi-region, log-file validation) into a WORM Object-Lock bucket, joined with the gateway log, per-Lambda aegis.call, Step Functions history, Bedrock model-invocation log and the WORM ledger into ONE lineage keyed by execution/trace/case id, with a coverage proof asserting zero orphan governed API calls. #169 token chargeback: the per-tenant budget meter usd_micro estimate reconciled against authoritative AWS billing (Cost Explorer ce:GetCostAndUsage, summed across all Bedrock service lines incl. the per-model marketplace label). LIVE on benefits (from-zero two-tenant deploy: isolation 12/12 incl. approval binding, #164 masking live on real Comprehend, #168 lineage 0 orphans + WORM immutability proven; torn down to zero residue, model-logging restored). Propagated offline (suites green): pharmacovigilance + edu_financial_aid re-pinned to 1.10.0. Housing (1.4.0) + eligibility (no dependency model) pending uplift. Evidence: benefits_eligibility_agent/evidence/GOVERNED-CORE-1.10.0-LIVE-GATE-2026-09-05.md. See docs/DEPENDENCY-MODEL.md."
  perimeter_guardrail_grounding_live: "2026-09-05 (benefits pack, LIVE, torn down to zero residue) three control-surface uplifts proven on the REAL AgentCore GA Cedar Policy engine + Bedrock guardrail: (1) #160/#161 CEDAR PERIMETER - zero-default entitlement (a caseworker with no custom:tools claim AND not in a tools_granted group is denied every tool) plus the remaining action-scoped Cedar conditions (service-window, consent+purpose-before-assess, budget-before-draft, decimal amount cap on overpayment), authored as scope:perimeter .cedar policies globbed into the gateway by IaC and validated ACTIVE on the GA engine (GA-schema-correct: optional context.input fields presence-guarded, no unscoped context.input on built-in actions, number tool fields as Cedar decimal), 6/6 live. (2) #166 OUTPUT GUARDRAIL AS IaC - the compute stack creates a Bedrock Guardrail from the manifest (PROMPT_ATTACK content filter + PII ANONYMIZE + a published immutable version pinned via a config-signature description so a policy change republishes) and wires it into the drafter (ApplyGuardrail, fail-closed on intervention), 7/7 live. (3) #150/#190 CONTEXTUAL GROUNDING END-TO-END - the guardrail carries a GROUNDING+RELEVANCE contextual-grounding policy AND the notice drafter enforces it: the model writes only the grounded factual core (case as grounding_source + a query via guardContent, so a hallucinated determination is grounding-blocked fail-closed) and the fixed notice boilerplate is appended deterministically outside the guardrail scope, so a legitimate notice is never false-blocked, 10/10 live. Account-level blockers recorded honestly: WAF<->Cognito association (#189) and Org SCP/RCP (#172) need a non-sandbox/Organizations account. Evidence: benefits_eligibility_agent/evidence/AGENTCORE-CEDAR-PERIMETER-2026-09-05.*, AGENTCORE-GUARDRAIL-2026-09-05.*, AGENTCORE-GROUNDING-2026-09-05.* + AGENTCORE-GROUNDING-DRAFTER-190-2026-09-05.*. Benefits pins governed-core 1.10.0; propagation to the other packs is roadmap."
  fault_semantics_1_10_1_live: "2026-09-05 governed-core 1.10.1 - fault-semantics batch closing the THREE critical blockers an EXTERNAL review reproduced (the strongest guarantees failing in exactly the fault conditions they cover). (1) WORM FAIL-OPEN CLOSED: a consequential commit previously proceeded on the DynamoDB ledger write alone (stored=True) even when the S3 Object-Lock WORM copy had failed (worm=False), writing the FINAL# marker + committed=True without immutable evidence. Now finalize_signoff (and request/approve) gate every side effect on evidence.is_durable = ledger AND WORM; record_event REPAIRS a missing WORM copy on replay from the authoritative stored item, so a transient S3 failure heals on retry instead of committing. (2) AUDIT-BEFORE-SIDE-EFFECT: request_signoff now REFUSES to start the Step Functions execution unless its INTENT evidence is durable (it previously ignored the write result); approve_signoff writes durable APPROVED evidence BEFORE releasing the task token, via an un-strandable idempotent saga (reserve -> durable evidence -> idempotent release -> mark released), so a consume-then-failure reconciles on retry instead of stranding the case. (3) AUTHORITATIVE CEDAR CONTEXT: the gateway interceptor now STRIPS caller-supplied consent/purpose/budget_ok/within_service_window and injects only server-authoritative values (server clock, live meter, optional pack `authoritative_context` resolver) - the 'nine-condition' model no longer trusts caller assertions; consent/purpose without a resolver stay UNSET so Cedar denies (fail-closed). +18 fault-injection tests (stored=True/worm=False must NOT commit; WORM-repair-on-replay commits; request/approve fail-closed + un-strandable saga; caller context fields stripped/overwritten). governed-core released as v1.10.1 (wheel + sha256), and ALL FOUR packs (benefits, pharmacovigilance, edu_financial_aid, Housing) re-pinned to 1.10.1 and offline-green - resolving the prior Housing 1.4.0 pin/maturity drift. #3 CLOSED END-TO-END + LIVE-PROVEN: the benefits pack ships lib/controls/authoritative_context.py (interceptor resolver reads consent/authorized-purpose from a server-side authz store by case_id); a from-zero ben-perim deploy proved it live (PASS, torn down): a case with a real authz record is ALLOWED, a caller that FORGES consent/purpose on a case with NO record is DENIED - and the interceptor injection reaches the Cedar decision. Benefits pilot tag re-cut as v0.5.1-pilot-rc1 (v0.4.0 predated the 2026-09-05 work) - SUPERSEDED 2026-09-06 by v0.5.2-pilot-rc1 after the Tier-1 live re-gate (tier1_live_regate_2026_09_06). The heavier full-portfolio live gates (111/kill-switch/budget/lineage/runtime-on-IaC-role, last green at 1.10.0) against the exact v0.5.2 tag remain the pending live step. Evidence: benefits_eligibility_agent/evidence/AGENTCORE-PERIMETER-AUTHZ-3-2026-09-05.md + RELEASE-MANIFEST.md."
  enforcement_perimeter_2026_09_05: "2026-09-05 ENFORCEMENT-PERIMETER review (a second external teardown: 'captures every API call cannot be guaranteed without SCPs / VPC-endpoint policies; invocation logging is an unredacted PII store; streaming/TTFT; multi-account'). VALIDATED against AWS docs and the code, claim by claim. (a) SCOPE CORRECTION: Aegis governs every call ON THE GOVERNED PATH preventively and the #168 capture trail records every Bedrock invocation in the account by ANY principal - CloudTrail logs InvokeModel / InvokeModelWithResponseStream / Converse / ConverseStream as MANAGEMENT events (docs.aws.amazon.com/bedrock/latest/userguide/logging-using-cloudtrail.html), so the review's 'data events are required' premise is wrong for those; the 'capture-every-API-call' label is now stated precisely (capture = account-wide; PREVENTION of direct calls = org boundary). (b) REAL GAPS CLOSED IN IaC (benefits, 4 CDK tests): the capture trail moved to ADVANCED selectors adding every documented Bedrock DATA-event resource type (Guardrail/ApplyGuardrail, AgentAlias/InvokeAgent, InlineAgent, FlowAlias, KnowledgeBase/Retrieve+RAG, Model+AsyncInvoke, Prompt) and AWS::BedrockAgentCore::Gateway, and its docstring no longer leans on invocation logging (mutable, per-region, non-WORM) for Bedrock coverage; a DETECTIVE <prefix>-bedrock-perimeter-bypass alarm (two metric filters on the capture log: role sessions whose ISSUING-ROLE arn is outside the allowlist, and any IAM-user/root caller) on the ops topic; the model-invocation store treated as regulated data (CMK on the log group + large-payload bucket with the bedrock service granted the key, Object-Lock COMPLIANCE + versioned + RETAIN + no auto-empty under -c model_log_lock_days>0, which the production gate now REQUIRES) - the governed drafter's input was already proven de-identified (P0-1) so the exposure is bypass callers' prompts, exactly what the alarm catches; the bedrock-runtime VPC endpoint carries an endpoint policy admitting only the governed drafter role pattern (+ -c approved_bedrock_principals), keyed on aws:PrincipalArn + aws:PrincipalAccount. (c) PREVENTIVE half SHIPPED as org/ templates with a renderer + lint + 4 tests: a corrected SCP (Deny on the 11 real Bedrock inference IAM actions incl. agents/KB/async/batch, allowlisted by ArnNotLike aws:PrincipalArn = the ROLE arn for a session; a statement protecting the allowlisted role ARNs from create/re-point by anyone but the deployer; a statement protecting invocation logging + the capture trail; a control-plane statement for guardrail/customization/provisioned-throughput changes), a standalone VPC-endpoint policy, and the CloudTrail selector set pinned equal to the pack's. The SCP PROPOSED by the review is kept as a regression fixture that must FAIL the lint: it ANDs aws:PrincipalType!=AssumedRole into the Deny (so no role session is ever denied - the EC2/ECS bypass it targets passes), keys stmt 2 on aws:userId (the CALLER-CHOSEN session name), lists bedrock:Converse/ConverseStream (not IAM actions; Converse authorizes as InvokeModel), exempts service-linked roles (SCPs never apply to them), and protects neither the allowlist nor the telemetry. (d) NOT APPLICABLE, documented: streaming/TTFT - the drafter is a synchronous Converse inside a workflow; there is no inline token proxy to buffer; agent-runtime streaming is AgentCore-native. (e) STATUS, honestly: pack-level halves are IaC-ASSERTED (31 CDK tests) with LIVE validation of the endpoint policy + CMK invocation store + bypass alarm staged into the next private-mode / capture_all gates; the SCP is STATICALLY validated - live SCP enforcement needs an Organization (the reference account is standalone; #172) and is step 1 of the landing-zone runbook. Backlog: PERIM-1..6 in docs/GAP-CLOSURE-BACKLOG.md."
  release_integrity_runtime_2026_09_05: "2026-09-05 THIRD external review (re-run against HEAD bcf8d7a): 'the fixes are real on main but release integrity is broken'. Reproduced and acted on the same day. (1) INTEGRITY LOCKS: lib/verify_core.py FAILED in benefits/PV/EDU (CORE_VERSION+core.lock at 1.9.0 vs the 1.10.1 pin; lib/controls edited without a relock) - CI mains were red; relocked all four packs at 1.10.1, verifiers OK, suites green, pushed. (2) SUPPORTED TAGS predate the fixed core in every pack (EDU/Housing RELEASE files even disagree with their own tags): benefits v0.5.2-pilot-rc1 cut after the Tier-1 live gate; siblings got 1.10.1 tags with honest live-vs-offline wording the same day (REL-2 DONE 2026-09-05: PV/EDU v0.4.0-pilot-rc1, Housing v0.11.0; wording re-audited 2026-09-06). (3) RUNTIME INPUT CONTRACT: the AgentCore entrypoint took an unvalidated prompt (AWS: structured input can cause direct tool dispatch) - now a bounded plain-string prompt + identifier-shaped ids, refused BEFORE any I/O (5 tests). (4) RUNTIME EXECUTION ROLE AS IaC: the toolkit auto-generated the role (AWS: dev/testing only) and a shell patched it; the compute stack now exports a least-privilege role (documented runtime policy scoped to region/account/runtime name + SSM/budget/ApplyGuardrail, SourceAccount/SourceArn trust, mandatory-guardrail condition) and the runtime model carries the platform guardrail; _configure.sh refuses without it; the committed ssm-pol.json (raw account id) removed. IaC-asserted (2 CDK + 1 runtime test); LIVE runtime gate on the IaC role is the next runtime milestone (RT-2). (5) CHECKOV baseline = 93 check-instances across 10 platform templates - burn-down plan CHK-1 (phased) in docs/GAP-CLOSURE-BACKLOG.md. (6) Test-run instructions now state the hash-pinned core install (REL-3)."
  tier1_live_regate_2026_09_06: "2026-09-06 TIER-1 LIVE RE-GATE PASS on benefits (env ben-t1, 111122223333/us-east-1, from-zero, PRIVATE network mode, customer-managed KMS, perimeter=1, account model-invocation logging into the CMK log group, capture-all CloudTrail with advanced selectors): deploy of all 8 stacks; P2 advanced selectors live (management + 12 Bedrock/AgentCore data-event types); P5 bedrock-runtime VPC-endpoint policy present naming the EXACT pinned drafter role; P4 invocation log group CMK-encrypted AND Bedrock delivered the drafter's rows into it; T1a guardrail proof (injection inside its own masked artifact blocked fail-closed, no canary leak; clean draft under the guardrail; ApplyGuardrail intervenes deterministically; grounding blocks ungrounded / passes grounded); T1b Cedar perimeter proof (entitlement, consent/purpose, budget, amount cap, service window) 6/6 in ENFORCE; P3 a REAL bypass (direct Converse by the deployer IAM user) fired <prefix>-bedrock-perimeter-bypass and the metric counted EXACTLY the non-allowlisted inference events in the capture log (1) while the drafter's 2 allowlisted calls through the endpoint were excluded; D2 operator console rendered live; teardown to ZERO residue by the driver itself with the account model-logging config restored. It took ELEVEN attempts: attempts 1-10 each failed on a defect the offline suite could not see, every one fixed the same day and pinned by a test - the live-found register L1-L13 (AZ availability of the cognito-idp endpoint; an invalid CloudTrail resource type; CMK grant scope; two undocumented AgentCore provider permissions incl. InvokeGateway for policy validation; a provider race on multi-target policy attach; MISSING ssm/monitoring VPC endpoints so every tool hung in private mode; the zero-default entitlement grant not being IaC; the endpoint policy naming the drafter by a wrong-case guessed role pattern (ArnLike is case-sensitive) - role now pinned; CloudTrail late deliveries breaking teardown; and two harness defects in the gate's own accounting/proof). PERIM-2/3/4/5 move from IaC-asserted to LIVE-PROVEN; REL-1 closed: benefits tag v0.5.2-pilot-rc1 cut from the exact gated tree (285 collected / 37 CDK). Evidence: benefits_eligibility_agent/evidence/TIER1-REGATE-2026-09-06.md + .json (redacted). Register: docs/GAP-CLOSURE-BACKLOG.md (2026-09-05 live-found section, L1-L13)."
  fourth_review_2026_09_06: "2026-09-06 FOURTH EXTERNAL REVIEW (verdict accepted: reference implementation + supervised synthetic sandbox = yes; pilot on real/regulated data = not yet; production = no; account-wide non-bypassable governance = no). Every finding checked against the code (docs/GAP-CLOSURE-BACKLOG.md R4-1..R4-15). Confirmed and FIXED the same day on benefits main: R4-3 exact-guardrail IAM (allow StringEquals <guardrail ARN[:version]> + explicit Deny StringNotEquals, model resources scoped to the manifest model - was a Null any-guardrail check on foundation-model/*), R4-5 runtime image pinned governed-core 1.9.0 while the Lambdas ran 1.10.1 (now 1.10.1 + agreement test; single versioned runtime package is PAR-3), R4-6 MMDSv2 explicit + asserted by the gate, R4-8 explicit Deny on GetWorkloadAccessTokenForUserId / InvokeAgentRuntimeForUser, R4-9 caller-supplied case_id/requester labelled as correlation with the verified JWT subject beside them, R4-7/R4-12 claims corrected (every-API-call, every-model-call-through-the-gateway, KMS-signed, reasoning spans, independently re-verified). Confirmed and OPEN: R4-1 account-wide enforcement is detective only until an Organization exists (PERIM-1b: Bedrock Organizations policy with an enforced guardrail + org-tested SCP), R4-2 gateway-only runtime invocation (RT-4), R4-4 immutable release (REL-6 after the from-zero gate is green), R4-10 COMPLIANCE-mode Object Lock live (EV-1), R4-11 multi-account, R4-13 security pipeline (SEC-1), R4-14 signing (SIG-1), R4-15 IdP/connector/DR/pen-test evidence. Partly right: R4-2 - the runtime own model calls are IAM+guardrail governed, not gateway governed (claim fixed); direct runtime invocation by a JWT holder is the designed entry."
  full_portfolio_gate_2026_09_06: "2026-09-06 FULL-PORTFOLIO LIVE GATE on the benefits v0.5.2 tree (env ben-fp, from zero, two tenants, real Runtime on the IaC role): attempts 2-3 found THREE defects earlier gates had not exercised on this tree - L14 the production DraftNotice path was ALWAYS blocked by contextual grounding (the drafter had only ever been proven with a proof-shaped input); L15 the runtime's guardrail-assessed prompt path refused an imperative proof prompt as a prompt attack; L16 six proof scripts still provisioned caseworkers without the #160 entitlement grant. All three are fixed on benefits main (AFTER the v0.5.2-pilot-rc1 tag) and attempt 4 is re-running from zero; until it is green the 111 / kill-switch / budget / lineage / RT-2 claims stand only for their ancestor trees. Honesty consequence: a proof that pre-shapes its input is not a proof of the production path - the gate now drives the workflow and the runtime with exactly the payloads production produces."
  pack_parity_2026_09_06: "2026-09-06 PACK PARITY (honesty): pinning governed-core 1.10.1 is NOT the same as wiring its controls. docs/PACK-PARITY.md (generated from the packs' CDK + runtime sources by tools/check_pack_parity.py, CI-checked when the packs are present) records which controls are actually IaC-wired per pack: benefits has every control (and is live-gated); pharmacovigilance + edu_financial_aid carry the 2026-09-02/03 set (multi-tenant, kill switch, budget, model logging, runtime hardening incl. IaC execution role as of 2026-09-06) and, as of PAR-1 steps 1-2 (2026-09-06, offline-gated only: CDK assertions + full-switch synth), EVERY control the lead pack carries (PAR-1 steps 1-5 complete 2026-09-06: capture-all lineage, enforcement perimeter, regulated invocation store, restore-aware model logging, pinned drafter role, output guardrail as IaC + grounded drafter, WAFv2, the #160 entitlement grant as IaC, the authoritative Cedar context resolver (#3) with its authz store and ingest attestation, the perimeter Cedar profile, and the fourth-review exact-guardrail IAM) - PACK-PARITY 15/15 for both, but OFFLINE-GATED ONLY: live-proven still means benefits. Signed manifests remain absent on PV/EDU (SIG-1) and their live re-gate is REL-5; housing is at the July-2026 Gate-B level (private network + MFA identity only; no multi-tenant / kill switch / budget / model logging / runtime hardening / 2026-09-05 controls) - backlog PAR-2. Live re-gates on 1.10.1 (REL-5) follow each pack's parity work. Any claim of the form 'the platform does X' is a claim about benefits unless PACK-PARITY.md shows a check mark for the pack in question."
  spec: docs/AGENTCORE-INTEGRATION.md
  note: "Policy is GA (2026-03-03); the reviewed platform_core engine stays as a defense-in-depth parity oracle + offline/outage fallback. Hybrid multi-tenant (shared control plane, per-tenant data INCLUDING the audit ledger / WORM vault / approvals register via governed-core 1.6.0) is LIVE-VALIDATED in the benefits pack (2 tenants), with FULL per-case transparency (framework/model-invocation + tool spans - not private chain-of-thought - + every governed-path API call + model-invocation bodies + WORM record joined by session/trace id, per tenant) live-proven through the AgentCore Runtime; per-customer single-tenant silo remains the default path."

  sec1_security_pipeline_2026_09_08: "2026-09-08 SEC-1 CLOSED ACROSS ALL FOUR PACKS, and closing it found that most of the pipeline had never actually run. Housing_eligibility_agent had NO security workflow at all - bandit, detect-secrets, checkov and trivy had never executed against that repo - and nothing detected it, because PACK-PARITY compares controls, not the CI that scans for them (L47). In the other three packs the workflow existed and four of its gates were inert: the .secrets.baseline was UTF-16LE so detect-secrets could not read it; the detect-secrets step diffed a file whose generated_at timestamp changes every run, so it could never pass on any tree; the checkov job synthesized zero templates because governed_core was not installed, and passed; and trivy was pinned to aquasecurity/trivy-action@0.28.0, a tag that does not exist (that action's tags are v-prefixed), so the container scan had been failing at Set up job and had never scanned an image (L44, L45). With trivy finally running, the runtime base image showed 30 fixable HIGH/CRITICAL, all in a python:3.12-slim digest resolved two months earlier (L46). ALL NOW FIXED AND ALL FOUR PACKS SCAN CLEAN: bandit -ll -ii exit 0 over every tracked .py file in each pack (B108 fixed /tmp probe paths -> per-run 0700 mkdtemp; B310 urlopen on configuration-supplied URLs -> fail-closed _require_https - both had been fixed in benefits only and were still open in PV, EDU and Housing, another PAR-4 instance); base image bumped to 78387bc3...e184ea in all four with a 90-day freshness test; detect-secrets replaced by tools/check_secrets_baseline.py comparing (filename, type, hashed_secret) with separator normalisation, proven against a Linux-shaped rescan; trivy repinned to commit ed142fd0673e97e23eac54620cfb913e5ce36c25 (v0.36.0); checkov installs the pinned core before synth. Housing's checkov baseline (67 findings, dev/sandbox profile) is committed as the STARTING POINT of CHK-1, not as a resolution, and is PROVEN FALLIBLE - a planted unencrypted S3 bucket makes it exit 1 with 6 new findings and no baselined finding leaking through. Suites: benefits 396, PV 308, EDU 299, Housing 207, all green. STILL OPEN: nothing compares workflow inventories across packs, so the next missing pipeline would be equally invisible (#230); tools/check_core_parity.py is wired into no CI workflow and no pre-commit hook in ANY pack - it exits 0 with a usage message when called with no arguments, which is how it would run in CI today. RESULT (2026-09-08, verified on the runner): the Security workflow is GREEN on all four packs for the first time, and all four jobs actually executed rather than being skipped - trivy built and scanned aegis-runtime:ci (debian 13.6, 0 vulnerabilities), checkov scanned real synthesized templates against the committed baseline, bandit clean, CodeQL security-extended. Getting there took three further corrections to the secret gate on the same day (L50): the checker compared the baseline's own FILE PATH as detection coverage; the baselines had been generated by detect-secrets 1.5.50 while CI pins 1.5.0, which disagree substantively; and they were generated from a Windows CRLF tree and verified against a Linux LF checkout. All four are now regenerated INSIDE a fresh clone on Linux with the pinned scanner, every finding reviewed, and the version skew is pinned by tests/test_secrets_baseline_pin.py with the procedure in docs/SECRETS-BASELINE.md."
  core_1_11_1_repin_2026_09_08: "2026-09-08 governed-core 1.11.1 TAGGED, RELEASED and RE-PINNED in all four packs (requirements-core.txt hash-pinned, lib/CORE_VERSION, lib/runtime/requirements.txt, lib/core.lock relocked; verify_core OK in all four). 1.11.1 carries the L39 fix - CloudWatch filter_log_events takes MILLISECONDS and the L33 change kept passing seconds, so every log read scanned from 1970 and found nothing silently. It had been committed and pushed on 2026-09-07 but never tagged, so no pack could pin it. Two findings came out of the re-pin. L51: the hash was pinned from a LOCALLY built wheel that gh release create had uploaded, and the release workflow firing on the same tag then rebuilt and REPLACED that asset - so a hash verified by hand minutes earlier was stale, and CI failed with THESE PACKAGES DO NOT MATCH THE HASHES; the pin must come from the release own RELEASE-HASHES.txt, and the check that proves it is running pip install --require-hashes rather than re-hashing a file you just uploaded. L52: four mechanisms agreed on the version (pin file, CORE_VERSION, core.lock, check_core_parity) while SEVENTEEN sentences across the four packs still said 1.10.1, including a copy-pasteable install line - nothing read the prose. tests/test_core_pin_docs.py now gates exactly the sentences that describe the pin, in all four packs, negation-controlled. All eight workflow runs (CI + Security x4) green afterwards."
  release_and_narrative_2026_09_08: "2026-09-08 RELEASE + NARRATIVE INTEGRITY (backlog 228/229/230, register L53-L55). Three findings, all in artefacts that declare themselves authoritative. (a) The portfolio front door named the WRONG four repos: README 13 mentions of the July-2026 packs against 2 of the governed packs, PORTFOLIO-START-HERE 4 against 0, EXECUTIVE-SUMMARY 5 against 0, MATURITY-SCORECARD 1 against 0 - and README instructed a CIO/CISO to review and approve all five TOGETHER, i.e. to approve four repos carrying none of these controls. README and START-HERE now describe two tiers with per-pack status from PACK-PARITY; the two long Tier-2 documents carry a currency banner rather than a rewrite, and say so. (b) All four packs Latest GitHub Release was 1-5 tags BEHIND their own RELEASE file (benefits v0.4.0 vs v0.6.0, PV v0.3.0 vs v0.4.0, EDU v0.2.0 vs v0.4.0, Housing v0.10.0 vs v0.11.0) - nothing checked what GitHub actually serves. All four current tags now published as Latest with notes stating what was proven AND what was not (benefits carries the 15/15 table alongside its two qualifications, L41 orphans and L37 residue; Housing states no AgentCore-era live gate has ever run on it and lists the controls that are ABSENT, not pending). (c) tools/check_core_parity.py was wired into NO workflow and NO hook in any of the five repos, and with no arguments it exited 0 - so wiring it up carelessly would have made a permanently green check that compared nothing. It now exits 2 rather than passing, and .github/workflows/parity.yml runs it over all four packs on push, on PRs and DAILY (the packs are separate repos; a pin can drift with no push here). The workflow proves its own fallibility on every run: planted hash mismatch must fail, no-arguments must fail. First runner execution confirmed all three."
  claim_accuracy_2026_09_08: "2026-09-08 CLAIM ACCURACY (backlog 231, register L56). Three claims that were each TRUE ABOUT A SUBSET and stated as the whole. (a) The full-portfolio gate reported teardown_zero_residue as PASS while the block immediately above it recorded the residue it had not looked at - the AgentCore toolkit ECR repository and CodeBuild project sit outside the deployment prefix, survive teardown, and accrue one image per run (20->22 images, 2544->2799 MB across two attempts). Renamed teardown_zero_stack_residue; the toolkit residue is now MEASURED (images, MB) and marked gated:false; render_gate_evidence describes both keys so past evidence stays readable; a negation-controlled test keeps the overclaiming name from returning. (b) The AWS Budgets ceiling was documented beside the real-time meter with nothing separating them. Per AWS docs, billing data Budgets uses is updated AT LEAST ONCE PER DAY and actual alerts fire ONCE PER BUDGET PER PERIOD - so the ceiling lags the spend by ~a day and will not re-fire after an operator disengages the kill switch. All three docs now state that the per-tenant DynamoDB meter is what refuses before the spend and the ceiling is a slow once-per-period backstop. (c) CHK-1 was tracked as a 93->0 checkov burn-down since 2026-09-05; 93 counts the PLATFORM baseline only. The packs carry 105+110+113+67 more: the portfolio total is 488 and the burn-down had been reporting 19% of its own scope. tools/checkov_baseline_census.py now COMPUTES it across every baseline, exits 2 if it finds none, takes --expect-total to pin a quoted figure, and prints the real work queue (Lambda concurrency/DLQ/VPC 83 each, Lambda env KMS 75, log-group KMS 62, DynamoDB CMK 32, PITR 31)."
  perimeter_correction_2026_09_08: "2026-09-08 CORRECTION to a standing claim (backlog 234, register L57). Since 2026-09-05 every honesty note has said account-wide enforcement is DETECTIVE ONLY until an AWS Organization exists (R4-1 / PERIM-1b). That is correct for SCPs and WRONG for guardrails. AWS ships an account-level enforced guardrail needing no Organization: it applies automatically to inputs and outputs of invocations that do NOT name a guardrail, so it cannot be bypassed by omitting one, and DeleteGuardrail is blocked while a guardrail is bound to it (docs.aws.amazon.com/bedrock/latest/userguide/guardrails-enforcements.html). Verified live on the reference account: list-enforced-guardrails-configuration returns an empty list - AVAILABLE and NOT SET. The claim now splits where it really divides: WHO may call Bedrock is preventable only with an Organization (SCP, still open); WHETHER a call that happens is guardrailed is preventable today, account-wide, closing the half of the bypass-caller gap that the #168 capture trail could only detect. scripts/account_enforced_guardrail.py reports read-only by default and REFUSES to apply or remove without an explicit typed blast-radius confirmation, because it changes every Bedrock call in the account and not just this platform s; it also enforces the documented traps (per-region, no automated-reasoning policy, numeric version only). SIX tests pin the refusals. NOT APPLIED - this is tooling plus a corrected claim, not a live account change, and it must not be quoted as account-wide non-bypassable governance: it is non-bypassable GUARDRAILING, one control, not the perimeter."
  doc_parity_2026_09_08: "2026-09-08 CROSS-REPO DOCUMENT PARITY (backlog 237, register L58). check_core_parity compared only the governed-core pin; nothing compared the ELEVEN files copied into four repositories by hand during this remediation - including the tests written to detect drift. Divergence had already begun: the four security workflows differed in a docker manifest inspect step and three comment blocks. tools/check_doc_parity.py now enforces SHARED (12 files byte-identical, line endings normalised and nothing else) and REQUIRED (11 files must exist - the L47 case), refuses rather than passing when it cannot see every pack, and runs in parity.yml on push, on PRs and daily with negative controls on every execution. Runner-verified: PARITY OK, DOC PARITY OK (12 shared identical, 11 required present, 4/4 packs), and all four negative controls firing - planted core-hash mismatch, no-arguments, planted shared-file divergence, deleted security workflow."
  pack_parity_matrix_2026_09_08: "2026-09-08 PACK-PARITY MATRIX CORRECTED (register L59). docs/PACK-PARITY.md - the page README points at as the authoritative per-pack control record - was stale (said every pack pins governed-core 1.10.1; they pin 1.11.1), overclaimed (printed 'lead pack; live-gated' for EVERY fully-wired pack, so PV and EDU read as live-gated when they are offline-gated only), and its freshness gate was a NO-OP (check_pack_parity --check returned 0 with 'nothing to verify (OK)' when the packs were absent, and the platform CI step running it never checked them out). It also told readers that live-proof status is recorded in each pack's MATURITY.yaml - NO PACK HAS ONE; only this repo does. Fixed: the renderer READS lib/CORE_VERSION from each pack instead of hardcoding a version, and reports disagreement; live-proof status is named data per pack (benefits LIVE-gated 15/15 from zero; PV and EDU offline-gated only since governed-core 1.9.0; Housing never live-gated in the AgentCore era); --check refuses rather than passing when it cannot see the packs; the no-op step is removed from ci.yml and the real check runs in parity.yml where the packs are cloned, with negative controls on every execution. With the version read rather than hardcoded, --check reported the file STALE on its first honest run."
