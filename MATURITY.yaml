  - {id: network_edge, name: VPC/PrivateLink (network.yaml) + WAFv2 (edge.yaml), maturity: implemented, note: "NOT WIRED (COPILOT-7, 2026-09-03): both templates are cfn-lint-clean minimal reference stacks, but NOTHING attaches them to a gateway workload - no gateway Lambda has a VpcConfig, no API stage has a WebACL association, and neither template has been deployed in a validated run (DEPLOYED-AND-VALIDATED.md Runs 1-13 never deploy them). Treat as design artefacts until a run wires them (context switch + synth test) and records it. On the AgentCore path the equivalent is AgentCore's own managed networking (NOT-CLAIMS.md: Bedrock over PrivateLink is a customer-VPC statement, not something these stacks prove). UPDATE #170 (2026-09-05, benefits pack, LIVE): the AgentCore-path equivalent IS now wired and proven - the benefits tool + drafter Lambdas run in private VPC subnets with a security group and Bedrock/DynamoDB/etc. VPC endpoints, and the live posture was MEASURED not asserted (0 NAT gateways, 0 internet gateways, endpoints present) on a from-zero deploy, then torn down. A REGIONAL WAFv2 Web ACL (AWS managed common rule set + per-IP rate limit) is built as IaC on the Cognito auth front door. #189 CORRECTION (2026-09-05, external review): the WAF<->Cognito association is AWS-SUPPORTED and the WAFUnavailableEntityException hit on association is a DOCUMENTED PROPAGATION DELAY ('a few seconds to a number of minutes', https://docs.aws.amazon.com/cognito/latest/developerguide/user-pool-waf.html), NOT an account/SCP block - an earlier 'account-level block' conclusion is retracted; the association harness now retries across ~6 min and a live re-run is pending. AgentCore Gateway is ALSO directly WAF-associable now (GatewayAssociateWebACL, https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-waf.html) - the earlier 'not WAF-associable' claim is retracted. Org-level SCP/RCP guardrails (#172) DO genuinely need real AWS Organizations connectivity beyond the sandbox. Evidence: benefits_eligibility_agent/evidence/AGENTCORE-NETWORK-WAF-2026-09-05.md."}
  - {id: identity_federation, name: Enterprise IdP federation (Entra ID / Okta / Ping / Login.gov), maturity: designed, note: "NOT BUILT (COPILOT-7, 2026-09-03): every validated run authenticates with a PORTABLE Cognito user pool (admin-created users, ID-token claims; MFA switch in the benefits pack). Federation to a customer IdP via Cognito (SAML/OIDC), group->entitlement claim mapping, SCIM and MFA policy are customer-configured engagement work - docs/10-PRODUCTION-READINESS-RACI.md row 4 (Customer = A/R). The entitlement CLAIM contract the gateway consumes (custom:tools / scope; zero tools without it - Run 13) is what an IdP integration must supply."}
  - {id: reference_tools, name: Tool execution in the reference stacks, maturity: implemented, note: "FIXTURES (COPILOT-7, 2026-09-03): every tool the portable reference gateway 'executes' (kb.search_policy, ticket.create_draft, ticket.submit) returns a labelled fixture string ('[fixture] <tool> executed') - the governance decision, masking, approval consume and audit are real, the downstream action is not. The ONE executed real connector in this repo is the DynamoDB system-of-record connector with idempotency + saga rollback (Run 9, 2026-07-01). Real SaaS / system-of-record connectors are engagement work (docs/CONNECTOR-MATURITY.md). The AgentCore packs execute real tools (Comprehend, Bedrock, DynamoDB, Step Functions) - see the benefits evidence."}
  - {id: agentcore_enforcement, name: AgentCore Gateway + Cedar Policy (managed control plane), maturity: deploy-validated, note: "UPDATE 2026-09-06: live-validated + torn down on every 2026-09 gate too - mt4 111 gate, mt5 kill switch, mt6 budget (2026-09-02/03), pv-mt (2026-09-03), fa-mt (2026-09-04), ben-perim (2026-09-05) and ben-t1 Tier-1 from-zero in PRIVATE mode (2026-09-06, see tier1_live_regate_2026_09_06); the GA Cedar engine in ENFORCE is the enforcement point on every one. Portfolio fact (2026-09-02): the vertical agent packs run on REAL Amazon Bedrock AgentCore Gateway (MCP, CUSTOM_JWT) with an AgentCore Cedar Policy engine in ENFORCE (deny-by-default, forbid-wins), stood up as IaC by a CloudFormation custom resource (benefits repo cdk/gateway_provider/handler.py). Live-validated + torn down: benefits EP1 ben-val1 2026-07-27, re-val ben-val2 2026-07-28, ben-demo 2026-08-24. Aegis (this platform) DEFINES the AGP pattern these enforce and adds what AgentCore does NOT: bound single-use SoD approval, fail-closed masking-before-audit, WORM tamper-evident audit, and CJIS/IRS-1075/42-CFR-Part-2/GxP/FERPA control mappings. AgentCore Policy is GA (2026-03-03); the reviewed platform_core engine remains a defense-in-depth parity oracle + offline/outage fallback. A platform-repo AgentCore reference deploy is roadmap. See docs/AGENTCORE-INTEGRATION.md."}

