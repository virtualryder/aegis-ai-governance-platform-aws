clean_account_deploy:
  status: platform-controls-validated
  detail: "13 live AWS runs of the governance core -> MCP endpoint (deployed, exercised with real
           requests, torn down; Run 13 = 2026-09-03 Copilot-review hardening). Live external SaaS
           connectors, monitoring, DR, and production certification remain OUTSIDE the repo
           (engagement/customer-owned)."
  evidence: evidence/CLEAN-ACCOUNT-ACCEPTANCE.md
  dependency_model: docs/DEPENDENCY-MODEL.md   # COPILOT-5: platform_core (oracle) vs governed-core (product) vs packs
  # HONESTY / scope of 'deploy-validated' below (updated 2026-07-12, B3): the inline governance SUBSET
  # has been REMOVED from mcp-gateway.yaml. The authorizer Lambda now imports the REVIEWED platform_core
  # engine from a Lambda layer — its authorization DECISION comes from platform_core.policy_engine (the
  # full 9-clause ALLOW-iff predicate) and its boundary masking from platform_core.masker (fail-closed),
  # both staged from the single source of truth ../platform_core by prepare_layer.sh (so the deployed
  # engine cannot drift from the offline-tested one). The template is cfn-lint-clean and the handler's
  # ALLOW/DENY/APPROVAL_REQUIRED decisions + masking are verified locally against the staged layer.
  # DONE (2026-07-12): the layer-backed authorizer was live-redeployed on a clean account
  # (111122223333, us-east-1, stack aegis-mcp-gateway-b3) and torn down with zero residual. Over HTTPS
  # with a Cognito ID token the REVIEWED engine returned ALLOW (kb.search_policy), ALLOW+masked
  # (ticket.create_draft — reviewed masker redacted SSN/email in the response AND the append-only audit
  # row), DENY (db.drop — deny-by-default), and APPROVAL_REQUIRED (ticket.submit — human gate). The
  # deny/gate strings are platform_core.policy_engine's verbatim messages, proving deployed == reviewed
  # engine. Evidence: infra/golden-pilot/B3-LIVE-DEPLOY-EVIDENCE.md.
  deployed_authorizer: mcp-gateway-platform_core-layer   # reviewed engine via layer; live-redeployed + torn down 2026-07-12

is_the_platform: true
components:
  - {id: policy_engine, name: Deny-by-default policy (least-privilege intersection), maturity: deploy-validated, note: "B3 (2026-07-12): inline subset deleted; mcp-gateway authorizer imports the reviewed platform_core.policy_engine (full 9-clause predicate) + masker from a Lambda layer, cfn-lint-clean. LIVE-REDEPLOYED on a clean account (aegis-mcp-gateway-b3, us-east-1) and torn down zero-residual: reviewed engine returned ALLOW/ALLOW+masked/DENY(deny-by-default)/APPROVAL_REQUIRED over HTTPS, deny strings verbatim from platform_core — deployed == reviewed engine. See infra/golden-pilot/B3-LIVE-DEPLOY-EVIDENCE.md. COPILOT-3 (2026-09-03, Run 13 LIVE): a caller with no entitlement claim (custom:tools / scope) gets ZERO tools - tools/list 403, tools/call 403; the demo default is an explicit, logged template parameter (DemoDefaultEntitlements, default 0) asserted OFF by clean_account_acceptance step 18 and by the deploy-evidence collector on the live function."}
  - {id: gateway, name: MCP authorization gateway, maturity: deploy-validated, note: "COPILOT-1 (2026-09-03): the reference engine now writes a durable AUTHORIZED-INTENT row (with an idempotency key) BEFORE consuming an approval or executing a connector, passes the key to the connector, keeps an outbox that refuses replays of a completed key, and answers INDETERMINATE (reconciliation_required) - never DENY - when the completion record cannot be written after execution. Proof demo/test_outbox.py; ordering table in GATEWAY-MODES.md. Offline reference change; the deployed golden-pilot authorizer executes fixtures only (no side effect to order)."}
  - {id: approval_ledger, name: Bound single-use SoD approvals, maturity: deploy-validated, note: "COPILOT-2 (2026-09-03, Run 13 LIVE): the deployed authorizer consumes an approval only for the FULL bound action - the reviewer stores agent_id/tool_id/args_hash/purpose on the ledger row and the gateway recomputes the binding from the actual call inside the same atomic DynamoDB ConditionExpression (exists + unconsumed + unexpired + requester + agent + tool + args + purpose). Live: modified args / wrong tool / replay -> DENY, exact -> ALLOW once. evidence/RUN13-BOUND-APPROVALS-ZERO-ENTITLEMENTS-2026-09-03.md"}
  - {id: masker, name: Fail-closed PII/PHI masking, maturity: deploy-validated, note: "B3 (2026-07-12): the reviewed platform_core.masker now runs in the deployed authorizer via the Lambda layer — live-verified redacting SSN/email before the append-only audit write on the aegis-mcp-gateway-b3 clean-account run"}
  - {id: audit_ledger, name: Append-only + WORM audit, maturity: deploy-validated}
  - {id: token_budget, name: Token budgets / cost control, maturity: deploy-validated, note: "2026-09-03: LIVE on the AgentCore path in the benefits pack (governed-core 1.9.0) - per-tenant token + USD meter with reserve-before / commit-after on every model call, plus an AWS Budgets USD ceiling whose breach engages the kill switch. See agentcore.budget_live."}
  - {id: model_gateway, name: Model gateway (Bedrock), maturity: implemented}
  - {id: prod_cedar, name: Cedar/Verified-Permissions compiler (prod), maturity: implemented}
  # COPILOT-7 (2026-09-03) - baseline-stack honesty. No code claim stronger than its evidence.
  - {id: reference_stack_gateway, name: CDK aegis-governance-core gateway Lambda, maturity: deploy-validated, note: "The CDK/Terraform/CFN reference stack's gateway function is a STUB (infra/terraform/modules/governance_core/index.py, inlined by the CDK stack): it reads the kill switch first, writes one audit record and applies the Bedrock guardrail. It does NOT speak MCP, evaluate the policy predicate, consume approvals or execute tools. It exists to validate the platform PRIMITIVES as IaC (WORM vault, CMKs, approval ledger, Budgets, CloudTrail, kill-switch SoD policies) - Run 11/12 live. The two governed gateways are (1) infra/golden-pilot/mcp-gateway.yaml (reviewed platform_core engine, MCP over API Gateway - the offline-parity reference, Runs 10/13) and (2) the AgentCore Gateway + interceptor the packs run on (governed-core). See docs/DEPENDENCY-MODEL.md."}
  - {id: network_edge, name: VPC/PrivateLink (network.yaml) + WAFv2 (edge.yaml), maturity: implemented, note: "NOT WIRED (COPILOT-7, 2026-09-03): both templates are cfn-lint-clean minimal reference stacks, but NOTHING attaches them to a gateway workload - no gateway Lambda has a VpcConfig, no API stage has a WebACL association, and neither template has been deployed in a validated run (DEPLOYED-AND-VALIDATED.md Runs 1-13 never deploy them). Treat as design artefacts until a run wires them (context switch + synth test) and records it. On the AgentCore path the equivalent is AgentCore's own managed networking (NOT-CLAIMS.md: Bedrock over PrivateLink is a customer-VPC statement, not something these stacks prove)."}
  - {id: identity_federation, name: Enterprise IdP federation (Entra ID / Okta / Ping / Login.gov), maturity: designed, note: "NOT BUILT (COPILOT-7, 2026-09-03): every validated run authenticates with a PORTABLE Cognito user pool (admin-created users, ID-token claims; MFA switch in the benefits pack). Federation to a customer IdP via Cognito (SAML/OIDC), group->entitlement claim mapping, SCIM and MFA policy are customer-configured engagement work - docs/10-PRODUCTION-READINESS-RACI.md row 4 (Customer = A/R). The entitlement CLAIM contract the gateway consumes (custom:tools / scope; zero tools without it - Run 13) is what an IdP integration must supply."}
  - {id: reference_tools, name: Tool execution in the reference stacks, maturity: implemented, note: "FIXTURES (COPILOT-7, 2026-09-03): every tool the portable reference gateway 'executes' (kb.search_policy, ticket.create_draft, ticket.submit) returns a labelled fixture string ('[fixture] <tool> executed') - the governance decision, masking, approval consume and audit are real, the downstream action is not. The ONE executed real connector in this repo is the DynamoDB system-of-record connector with idempotency + saga rollback (Run 9, 2026-07-01). Real SaaS / system-of-record connectors are engagement work (docs/CONNECTOR-MATURITY.md). The AgentCore packs execute real tools (Comprehend, Bedrock, DynamoDB, Step Functions) - see the benefits evidence."}
  - {id: agentcore_enforcement, name: AgentCore Gateway + Cedar Policy (managed control plane), maturity: deploy-validated, note: "Portfolio fact (2026-09-02): the vertical agent packs run on REAL Amazon Bedrock AgentCore Gateway (MCP, CUSTOM_JWT) with an AgentCore Cedar Policy engine in ENFORCE (deny-by-default, forbid-wins), stood up as IaC by a CloudFormation custom resource (benefits repo cdk/gateway_provider/handler.py). Live-validated + torn down: benefits EP1 ben-val1 2026-07-27, re-val ben-val2 2026-07-28, ben-demo 2026-08-24. Aegis (this platform) DEFINES the AGP pattern these enforce and adds what AgentCore does NOT: bound single-use SoD approval, fail-closed masking-before-audit, WORM tamper-evident audit, and CJIS/IRS-1075/42-CFR-Part-2/GxP/FERPA control mappings. AgentCore Policy is GA (2026-03-03); the reviewed platform_core engine remains a defense-in-depth parity oracle + offline/outage fallback. A platform-repo AgentCore reference deploy is roadmap. See docs/AGENTCORE-INTEGRATION.md."}

agentcore:                                     # Amazon Bedrock AgentCore adoption (portfolio-level fact)
  status: adopted-in-packs
  aws_ga: [runtime, gateway, identity, memory, observability, policy]   # GA Oct 2025; policy GA 2026-03-03
  aws_preview: [evaluations]                   # evaluations preview Dec 2025; policy is now GA (2026-03-03, Cedar default-deny tool authz)
  enforcement: "AgentCore Gateway + Cedar Policy engine in ENFORCE (deny-by-default) in the vertical packs"
  aegis_adds: [bound-single-use-SoD-approval, fail-closed-masking-before-audit, WORM-tamper-evident-audit, control-mappings, evidence-discipline]
  live_evidence:                               # in the agent repos (not this repo)
    - "benefits_eligibility_agent: evidence/EP1-VALIDATION.md (ben-val1 2026-07-27; ben-val2 2026-07-28) - Cedar ENFORCE attached as IaC, all gates pass, torn down"
    - "benefits_eligibility_agent: evidence/DEMO-DEPLOY-2026-08-24.md (ben-demo) - engine ben_demo_ben_authz ENFORCE, synthetic cases to human gate"
  fresh_run: "2026-09-02 live ENFORCE re-verified on current code (111122223333/us-east-1): gateway ben-demo-ben-gw-2cdvjxaxth READY (MCP,CUSTOM_JWT); Cedar engine ben_demo_ben_authz ACTIVE mode=ENFORCE; 8 tool targets READY; env torn down 2026-09-02 (zero residual). Evidence: benefits_eligibility_agent/evidence/AGENTCORE-LIVE-2026-09-02.md"
  multitenant_live: "2026-09-02 HYBRID two-tenant e2e PASS (111122223333/us-east-1, env mt): one shared AgentCore control plane (gateway ben-mt-ben-gw-20vmzpygzi ENFORCE + REQUEST interceptor ben-mt-tenant-interceptor, passRequestHeaders) + 2 physically separate per-tenant data stacks. cw-a/cw-b (tenant_pha-a/b groups) allowed and routed ONLY to their own store (pha-a 1/pha-b 0/base 0 then 1/1/0); un-tenanted cw-none: 0 tools listed (require_tenant Cedar) + call 403 verbatim 'identity carries no tenant'. Evidence: benefits_eligibility_agent/evidence/AGENTCORE-MULTITENANT-E2E-2026-09-02.md; design docs/MULTI-TENANT-SAAS-DESIGN.md. Torn down."
  multitenant_audit_live: "2026-09-02 per-tenant AUDIT routing PASS (env mt2, 12/12 checks): governed-core 1.6.0 (tenancy promoted into the core; pinned by hash) routes the canonical evidence writer, the exactly-once finalize marker and the pending-approvals register to the acting tenant's own ledger / WORM vault / approvals table across BOTH hops - gateway write_audit as cw-a/cw-b landed only in pha-a/pha-b (base ledger + base vault 0 writes all run); workflow execution carrying the HMAC-signed tenant pair reached HumanSignoff writing INTENT evidence + pending approval to pha-a only; the same execution without the pair FAILED at the first state (fail-closed). Found+fixed live: missing signing-secret IAM read on the verifier Lambdas; failure-poisoning secret cache. Evidence: benefits_eligibility_agent/evidence/AGENTCORE-MULTITENANT-AUDIT-2026-09-02.md. Torn down."
  observability_live: "2026-09-02 FULL TRANSPARENCY PASS (env mt3, 2 tenants, 13/13 checks each) through the REAL AgentCore Runtime (Strands on Bedrock, ADOT): one correlation set (tenant, session_id, trace_id, request_id, case_id) joins the runtime's invoke_agent/model/tool spans (the model's reasoning), every gateway request row, each tool Lambda's structured aegis.call line, every Bedrock model-invocation row (exact bodies, requestMetadata-tagged per tenant/session) and the hash-chained WORM record (correlation block hashed). masked_before_model true for all invocations; other tenant's ledger empty. governed-core 1.7.1 (telemetry.py). Evidence: benefits_eligibility_agent/evidence/AGENTCORE-OBSERVABILITY-2026-09-02.md (+ per-tenant timelines, JSON); design docs/OBSERVABILITY-CORRELATION.md. Torn down; account model-logging config restored."
  gate_111: "2026-09-02 CONSOLIDATED GATE PASS on benefits release v0.3.0-pilot-rc1 (env mt4, ONE from-zero deployment): isolation + per-tenant audit routing 12/12, full transparency through the real AgentCore Runtime 13/13 per tenant, strict PII canary clean, end-to-end regression sweep 0 unexpected errors (20 log groups, all executions, alarms, DLQs, Lambda error metrics). Evidence: benefits_eligibility_agent/evidence/AGENTCORE-111-GATE-2026-09-02.md. Torn down; account model-logging config restored."
  kill_switch_live: "2026-09-03 KILL SWITCH on the AgentCore path PASS (env mt5, 2 tenants, real Runtime, 29/29 checks, time-to-effect 13.9 s): governed-core 1.8.0 (hash-pinned) reads the deployment's SSM kill-switch FIRST in the gateway REQUEST interceptor (tools/list + tools/call -> 403 + DENIED WORM record in the acting tenant's ledger), in every tool Lambda (KillSwitchEngaged before the handler; a Step Functions execution fails at its first state) and in the Runtime (new invocation refused; a RUNNING session stopped at its next model call); fail-closed on an unreadable flag, 15 s TTL. Engage/disengage = two AWS_IAM Lambda function URLs with one managed policy each (IAM SoD) + in-code same-identity refusal (DENIED record); the actor is the IAM-verified caller ARN; every state change is a COMMITTED row in the base ledger's hash-chained KILL-SWITCH case with WORM copies; 0-unexpected-errors sweep after. Evidence: benefits_eligibility_agent/evidence/AGENTCORE-KILL-SWITCH-2026-09-03.md. Torn down."
  budget_live: "2026-09-03 PER-TENANT TOKEN + USD BUDGET on the AgentCore path PASS (env mt6, 2 tenants, real Runtime, 24/24 checks): governed-core 1.9.0 budget.py meters EVERY model call - one conditional DynamoDB reservation (ADD used/reserved with used <= cap, cannot oversell) BEFORE the call in the Runtime (botocore before-call hook), the drafter Lambda and the gateway interceptor (tools/call refused 403 + DENIED WORM record in the acting tenant's ledger when at/over cap); the real Converse usage is committed AFTER with a USD estimate from a pinned price table (price_version recorded on every commit; Anthropic models are absent from the AWS Price List API, so the table is pinned and labelled). Proven: meter == the account's Bedrock model-invocation log to the token (tokens_in 7004 / out 305 / 2 calls / usd_micro 25587 on the run-1 window); capped tenant refused at gateway, drafter (Step Functions DraftNotice -> ManualReview, fail-closed) and runtime, plus a RUNNING session stopped mid-session at its next model call; per-tenant cap overrides by PutItem; 60/85 % CloudWatch alarms (Aegis/Budget TokensUsedPct + UsdUsedPct) reached ALARM; AWS Budgets monthly USD ceiling (Service = Amazon Bedrock, ACTUAL + FORECASTED notifications, APPLY_IAM_POLICY action that denies bedrock:Invoke*/Converse* on the drafter + Runtime roles at 100 % ACTUAL) with a breach Lambda that engages the kill switch - exercised with a synthetic breach notification (Budgets evaluates spend up to 3x/day; ExecuteBudgetAction is refused while the action is STANDBY, seen live) and released by the deployer identity; 0-unexpected-errors sweep after. Finding closed on the sweep: the drafter's workflow-hop refusal needs the append-only ledger grant (Put + Get + TransactWrite, no Update/Delete) to land its DENIED record. Evidence: benefits_eligibility_agent/evidence/AGENTCORE-BUDGET-2026-09-03.md; design docs/TOKEN-BUDGETS-AND-COST-CEILINGS.md. Torn down; account model-logging config restored."
  pack_repin_gap1: "2026-09-03 GAP-1: the pharmacovigilance pack re-pinned from governed-core 1.5.0 to 1.9.0 (all four SaaS/observability/containment/budget controls) and RE-GATED LIVE on a from-zero two-tenant AgentCore deployment (env pv-mt, 111122223333/us-east-1, real Runtime pv_runtime_agent), then torn down to zero residue with the account model-logging config restored: isolation + per-tenant audit routing 12/12, full transparency 13/13 per tenant, strict PII canary 0 hits, kill switch 29/29 (10s to effect), per-tenant token+USD budget 24/24, end-to-end regression sweep 0 unexpected. The sweep caught a real PV tool bug the workflow-only proofs had missed (assess_seriousness crashed on the agent path because the manifest types `flags` as a JSON string; fixed + regression-tested + re-gated). Tag pharmacovigilance v0.3.0-pilot-rc1; benefits also re-affirmed on v0.4.0-pilot-rc1. EDU (1.5.0) and Housing (1.4.0) remain behind pending their own re-pin. Evidence: pharmacovigilance_agent/evidence/AGENTCORE-{111-GATE,KILL-SWITCH,BUDGET}-2026-09-03.*. See docs/DEPENDENCY-MODEL.md."
  pack_repin_gap1_edu: "2026-09-04 GAP-1 (cont.): the EDU financial-aid pack re-pinned from governed-core 1.5.0 to 1.9.0 and RE-GATED LIVE on a from-zero two-tenant AgentCore deployment (env fa-mt, 111122223333/us-east-1, 8 stacks, real Runtime financial_aid_runtime_agent), then torn down to zero residue with the account model-logging config restored: isolation + per-tenant audit routing 12/12, full transparency 13/13 per tenant (model invocations tenant-tagged, masked-before-model), strict PII canary 0 hits, kill switch 29/29 (in-flight mid-session stop, 4.2s to effect), per-tenant token+USD budget 24/24 (drafter draft_award_notice fail-closed to ManualReview with a DENIED row), end-to-end regression sweep 0 unexpected. The gate surfaced a cluster of latent port defects the offline suite could not: the runtime was launched against the stale single-tenant fa-financial deployment (wrong gateway/SSM/budget env), the runtime exec role never received its SSM/budget grant (the launcher skipped it fail-closed), lib/runtime/agent.py was still the pre-1.9.0 generic agent (no session-tenant binding, per-call budget, runtime kill-switch, or requestMetadata tenant tagging -> ported the full benefits runtime keeping EDU token_boundary P0-3), the workflow hard-coded selected_for_verification=True so no case could reach HumanSignoff (made a caller input via a SelectedProvided choice defaulting True), and the AgentCore MCP client teardown masked the governed mid-session kill with a 500 (invoke() now captures the outcome). Offline suite 174->190 (runtime kill-switch + MCP-teardown regression tests). Tag edu_financial_aid v0.3.0-pilot-rc1. Housing (1.4.0) remains behind. Evidence: edu_financial_aid_agent/evidence/AGENTCORE-{111-GATE,KILL-SWITCH,BUDGET}-2026-09-04.*. See docs/DEPENDENCY-MODEL.md."
  correctness_batch_1_10_0_live: "2026-09-05 governed-core 1.10.0 correctness batch + capture-every-API-call + token chargeback. Three fixes: audit fail-closed (#159 - finalize writes the COMMITTED WORM/hash-chained evidence BEFORE the exactly-once FINAL# marker, so an evidence-store failure marks nothing finalized and a retry re-commits cleanly, closing the audit-failure-before-side-effect fail-open); approval binding (#162 - approvals bound to case/requester/agent/action/purpose/args_sha256; finalize recomputes and refuses a consumed approval reused for a different action); deepened PII/PHI (#164 - shared pii_detect: UTF-8 byte-window chunking past Comprehend sync size limit so a large record tail is never returned unmasked, plus a Luhn-checked regex backstop for SSN/EMAIL/PHONE/IP/CARD). #168 capture-every-API-call: an account CloudTrail (management ALL + S3/Lambda data events, multi-region, log-file validation) into a WORM Object-Lock bucket, joined with the gateway log, per-Lambda aegis.call, Step Functions history, Bedrock model-invocation log and the WORM ledger into ONE lineage keyed by execution/trace/case id, with a coverage proof asserting zero orphan governed API calls. #169 token chargeback: the per-tenant budget meter usd_micro estimate reconciled against authoritative AWS billing (Cost Explorer ce:GetCostAndUsage, summed across all Bedrock service lines incl. the per-model marketplace label). LIVE on benefits (from-zero two-tenant deploy: isolation 12/12 incl. approval binding, #164 masking live on real Comprehend, #168 lineage 0 orphans + WORM immutability proven; torn down to zero residue, model-logging restored). Propagated offline (suites green): pharmacovigilance + edu_financial_aid re-pinned to 1.10.0. Housing (1.4.0) + eligibility (no dependency model) pending uplift. Evidence: benefits_eligibility_agent/evidence/GOVERNED-CORE-1.10.0-LIVE-GATE-2026-09-05.md. See docs/DEPENDENCY-MODEL.md."
  spec: docs/AGENTCORE-INTEGRATION.md
  note: "Policy is GA (2026-03-03); the reviewed platform_core engine stays as a defense-in-depth parity oracle + offline/outage fallback. Hybrid multi-tenant (shared control plane, per-tenant data INCLUDING the audit ledger / WORM vault / approvals register via governed-core 1.6.0) is LIVE-VALIDATED in the benefits pack (2 tenants), with FULL per-case transparency (agent reasoning spans + every API call + model-invocation bodies + WORM record joined by session/trace id, per tenant) live-proven through the AgentCore Runtime; per-customer single-tenant silo remains the default path."

