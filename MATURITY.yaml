  - {id: approval_ledger, name: Bound single-use SoD approvals, maturity: deploy-validated, note: "COPILOT-2 (2026-09-03, Run 13 LIVE): the deployed authorizer consumes an approval only for the FULL bound action - the reviewer stores agent_id/tool_id/args_hash/purpose on the ledger row and the gateway recomputes the binding from the actual call inside the same atomic DynamoDB ConditionExpression (exists + unconsumed + unexpired + requester + agent + tool + args + purpose). Live: modified args / wrong tool / replay -> DENY, exact -> ALLOW once. evidence/RUN13-BOUND-APPROVALS-ZERO-ENTITLEMENTS-2026-09-03.md"}
  - {id: masker, name: Fail-closed PII/PHI masking, maturity: deploy-validated, note: "B3 (2026-07-12): the reviewed platform_core.masker now runs in the deployed authorizer via the Lambda layer — live-verified redacting SSN/email before the append-only audit write on the aegis-mcp-gateway-b3 clean-account run"}
  - {id: audit_ledger, name: Append-only + WORM audit, maturity: deploy-validated}
  - {id: token_budget, name: Token budgets / cost control, maturity: deploy-validated, note: "2026-09-03: LIVE on the AgentCore path in the benefits pack (governed-core 1.9.0) - per-tenant token + USD meter with reserve-before / commit-after on every model call, plus an AWS Budgets USD ceiling whose breach engages the kill switch. See agentcore.budget_live."}
