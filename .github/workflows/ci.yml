name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: python (compile + acceptance)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest jsonschema cryptography pyyaml

      - name: Byte-compile control plane, demo, and tools
        run: python -m compileall platform_core demo tools

      # COPILOT-4: every tracked shell script must be LF and parse; the layer staging script must run.
      - name: Shell scripts are LF and parse (bash -n); stage the layer; the deployed authorizer is the reviewed engine
        run: |
          set -e
          bad=0
          while IFS= read -r f; do
            if grep -q $'\r' "$f"; then echo "CRLF line endings: $f"; bad=1; fi
            bash -n "$f" || bad=1
          done < <(git ls-files '*.sh')
          test "$bad" -eq 0
          (cd infra/golden-pilot && bash prepare_layer.sh && python verify_authorizer_engine.py)

      # COPILOT-6: the platform_core wheel must be a real, installable package (it shipped zero modules
      # before 0.2.0). Build it, install it in a clean venv away from the repo, import everything.
      - name: platform_core wheel builds, installs in a clean venv and imports
        run: bash tools/check_wheel.sh dist

      - name: Record the wheel hash
        run: |
          set -eu
          cd dist && sha256sum *.whl | tee RELEASE-HASHES.txt
          echo "Consumers pin this hash with pip --require-hashes; if it changes, installs fail loudly."

      - uses: actions/upload-artifact@v4
        with:
          name: platform_core-wheel
          path: dist/*

      - name: Check MATURITY.yaml test count (drift gate)
        run: python tools/check_maturity.py

      # COPILOT-6d: every relative Markdown link resolves; no UTF-8 mojibake in tracked text files.
      - name: Docs hygiene (links + encoding)
        run: python tools/check_docs.py

      - name: Run clean-account acceptance demo
        run: python demo/clean_account_acceptance.py

      - name: Run fail-closed regression tests
        run: python demo/test_fail_closed.py

      - name: Run production-component tests
        run: python demo/test_prod_components.py

      - name: Run negative-security suite
        run: python demo/test_negative_security.py

      - name: Durable intent / outbox ordering (COPILOT-1)
        run: PYTHONPATH=platform_core:. python -m pytest demo/test_outbox.py -q -rs

      # Previously NOT run by CI at all: platform_core/tests (AGP conformance, NER masker,
      # status-drift gate) and demo/test_acceptance.py + demo/test_evidence_vault.py. They passed,
      # but nothing proved it on an ongoing basis while the repo advertised continuous validation.
      - name: Pytest suites (platform_core + acceptance + evidence vault)
        run: PYTHONPATH=platform_core:. python -m pytest platform_core/tests demo/test_acceptance.py demo/test_evidence_vault.py -q -rs

      - name: Run kill-switch containment suite
        run: PYTHONPATH=platform_core:. python -m pytest demo/test_kill_switch.py -q -rs

      - name: CDK governance-core synth assertions
        run: |
          pip install -q -r infra/cdk/requirements.txt pytest
          python -m pytest infra/cdk/tests -q -rs

      - name: Assert CI runs every test file (no silently-unexecuted suites)
        run: PYTHONPATH=platform_core:. python -m pytest platform_core/tests/test_ci_coverage.py -q -rs

  iac:
    name: iac (cfn-lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: Lint CloudFormation templates
        run: cfn-lint infra/cloudformation/*.yaml infra/golden-pilot/*.yaml

  security:
    name: security (bandit + checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanners
        run: pip install bandit==1.9.4 checkov

      - name: Run bandit (non-blocking)
        continue-on-error: true
        run: bandit -r platform_core tools

      # HARD-FAIL (#165): baseline grandfathers triaged findings; a NEW misconfiguration fails the build.
      - name: Run checkov on IaC (hard-fail against baseline)
        run: checkov -d infra --framework cloudformation --quiet --compact --baseline infra/.checkov.baseline

  # On a version tag (vX.Y.Z), publish the wheel + its hash on the GitHub release (created by the
  # release step below if the tag has none) - the governed-core release discipline, adopted here
  # 2026-09-03 (COPILOT-6). The release's assets are what a consumer's hash pin verifies.
  release:
    name: release (tag only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: python
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: platform_core-wheel
          path: dist
      - name: Version in the tag matches VERSION + pyproject
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          test "$(cat VERSION | tr -d '[:space:]')" = "$tag" || { echo "VERSION=$(cat VERSION) != tag $tag"; exit 1; }
          grep -q "^version = \"$tag\"" platform_core/pyproject.toml || { echo "pyproject version != tag"; exit 1; }
          ls dist/aegis_platform_core-"$tag"-*.whl
      - name: Create the release if the tag has none, then attach the wheel + hashes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "aegis-platform-core ${GITHUB_REF_NAME#v}" \
              --notes "See CHANGELOG.md. Wheel + sha256 attached; pin with pip --require-hashes."
          gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/RELEASE-HASHES.txt --clobber
