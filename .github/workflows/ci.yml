name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: python (compile + acceptance)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest jsonschema cryptography pyyaml

      - name: Byte-compile control plane, demo, and tools
        run: python -m compileall platform_core demo tools

      # COPILOT-4: every tracked shell script must be LF and parse; the layer staging script must run.
      - name: Shell scripts are LF and parse (bash -n); stage the layer; the deployed authorizer is the reviewed engine
        run: |
          set -e
          bad=0
          while IFS= read -r f; do
            if grep -q $'\r' "$f"; then echo "CRLF line endings: $f"; bad=1; fi
            bash -n "$f" || bad=1
          done < <(git ls-files '*.sh')
          test "$bad" -eq 0
          (cd infra/golden-pilot && bash prepare_layer.sh && python verify_authorizer_engine.py)

      - name: Check MATURITY.yaml test count (drift gate)
        run: python tools/check_maturity.py

      - name: Run clean-account acceptance demo
        run: python demo/clean_account_acceptance.py

      - name: Run fail-closed regression tests
        run: python demo/test_fail_closed.py

      - name: Run production-component tests
        run: python demo/test_prod_components.py

      - name: Run negative-security suite
        run: python demo/test_negative_security.py

      - name: Durable intent / outbox ordering (COPILOT-1)
        run: PYTHONPATH=platform_core:. python -m pytest demo/test_outbox.py -q -rs

      # Previously NOT run by CI at all: platform_core/tests (AGP conformance, NER masker,
      # status-drift gate) and demo/test_acceptance.py + demo/test_evidence_vault.py. They passed,
      # but nothing proved it on an ongoing basis while the repo advertised continuous validation.
      - name: Pytest suites (platform_core + acceptance + evidence vault)
        run: PYTHONPATH=platform_core:. python -m pytest platform_core/tests demo/test_acceptance.py demo/test_evidence_vault.py -q -rs

      - name: Run kill-switch containment suite
        run: PYTHONPATH=platform_core:. python -m pytest demo/test_kill_switch.py -q -rs

      - name: CDK governance-core synth assertions
        run: |
          pip install -q -r infra/cdk/requirements.txt pytest
          python -m pytest infra/cdk/tests -q -rs

      - name: Assert CI runs every test file (no silently-unexecuted suites)
        run: PYTHONPATH=platform_core:. python -m pytest platform_core/tests/test_ci_coverage.py -q -rs

  iac:
    name: iac (cfn-lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: Lint CloudFormation templates
        run: cfn-lint infra/cloudformation/*.yaml infra/golden-pilot/*.yaml

  security:
    name: security (bandit + checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanners
        run: pip install bandit==1.9.4 checkov

      - name: Run bandit (non-blocking)
        continue-on-error: true
        run: bandit -r platform_core tools

      - name: Run checkov on IaC (non-blocking)
        continue-on-error: true
        run: checkov -d infra/cloudformation --quiet --compact
